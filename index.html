<html>
<head>
	<meta charset="utf-8">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css";; rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>;

    <style>
        
        body{
        	background-color:skyblue;

    	* {

    	}

    	div{

<body>
<br><br><br>
<center>
        <h1> Vbux transactions </h1>
</center>
<br><br>
	<div class="container">


		<script>
            var weight = 1000; //given value for weight in grams

			document.write("<h2>Click the button</h2>" + "<kbd>" + weight + "g" + "</kbd>" +"<h2>Change the weight to different scale</h2>");
	    </script>
	    </script>

	    <p id="display"></p>

	    <br>

	    <button type="button" class="btn btn-primary" onclick="document.getElementById('display').innerHTML='<kbd>'+ 100*0.59 +' baht';">Baht
	    </button>

	    <button type="button" class="btn btn-primary" onclick="document.getElementById('display').innerHTML='<kbd>'+ 100*0.017 +' dollars';">Dollars
	    </button>
